name: Agent repository map generator

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: agent-repository-map-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  generate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out current PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Rebuild exhaustive repository map
        shell: bash
        run: |
          set -euo pipefail
          cat .github/agent-map-payload/part-* | base64 --decode | gzip --decompress > /tmp/build_agent_map.py
          python /tmp/build_agent_map.py
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/AGENT_REPOSITORY_MAP.md')
          text = path.read_text(encoding='utf-8')
          text = text.replace('**74 test modules**', '**74 Python files under `tests/`**')
          text = text.replace(
              'The base contains **74 `test_*.py` modules**.',
              'The base contains **74 Python files under `tests/`, including 69 `test_*.py` modules**.',
          )
          path.write_text(text, encoding='utf-8')
          PY
          echo "604e06532ae3b26dedb5e72eb131900ef18a000fef43601643e4b87e42a25f45  docs/AGENT_REPOSITORY_MAP.md" | sha256sum --check --strict
          grep -Fq 'Base paths inventoried: **229/229**' docs/AGENT_REPOSITORY_MAP.md

      - name: Commit generated map
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/AGENT_REPOSITORY_MAP.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs: correct exhaustive map inventory labels"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
