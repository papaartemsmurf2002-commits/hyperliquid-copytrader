name: Apply runtime hardening payload

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: runtime-hardening-payload-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out current PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Reconstruct and validate exact tree
        id: reconstruct
        shell: bash
        run: |
          set +e
          report=/tmp/runtime-hardening-import-report.txt
          patch=/tmp/runtime-hardening.patch
          encoded=/tmp/runtime-hardening.b64
          compressed=/tmp/runtime-hardening.patch.gz
          expected_patch=d88cd1bb27001923a0d1b65b39dcfcb56c36ef0cce1585014c7e5a5728b91689
          expected_tree=7fc399c314ca1cafb0685e20e55140b28915780e
          ready=true
          : > "$report"

          python - <<'PY' >> "$report" 2>&1
          from __future__ import annotations

          import hashlib
          from pathlib import Path

          path = Path('.github/runtime-hardening-payload/part-07')
          expected = '50250e71dd65c71c868bd420b66d83f225c8682a'
          alphabet = b'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/='

          def git_blob_sha(data: bytes | bytearray) -> str:
              payload = b'blob ' + str(len(data)).encode('ascii') + b'\0' + bytes(data)
              return hashlib.sha1(payload).hexdigest()

          data = bytearray(path.read_bytes())
          before = git_blob_sha(data)
          print(f'part_07_before={before}')
          if before != expected:
              matches: list[tuple[int, int, int, bytes]] = []
              for index, original in enumerate(data):
                  for replacement in alphabet:
                      if replacement == original:
                          continue
                      data[index] = replacement
                      if git_blob_sha(data) == expected:
                          matches.append((index, original, replacement, bytes(data)))
                  data[index] = original
              if len(matches) != 1:
                  raise RuntimeError(
                      f'expected one part-07 repair, found {len(matches)}'
                  )
              index, original, replacement, corrected = matches[0]
              path.write_bytes(corrected)
              print(
                  f'part_07_repaired_index={index} '
                  f'from={chr(original)!r} to={chr(replacement)!r}'
              )
          after = git_blob_sha(path.read_bytes())
          print(f'part_07_after={after}')
          if after != expected:
              raise RuntimeError(f'part-07 hash mismatch after repair: {after}')
          PY
          repair_status=$?
          echo "repair_status=$repair_status" >> "$report"
          if [ "$repair_status" -ne 0 ]; then
            ready=false
          fi

          echo "payload parts:" >> "$report"
          for file in .github/runtime-hardening-payload/part-*; do
            printf '%s\t%s\t%s bytes\n' \
              "$file" \
              "$(git hash-object "$file")" \
              "$(wc -c < "$file" | tr -d ' ')" \
              >> "$report"
          done

          cat .github/runtime-hardening-payload/part-* > "$encoded"
          base64 --decode "$encoded" > "$compressed" 2>> "$report"
          decode_status=$?
          echo "base64_status=$decode_status" >> "$report"
          if [ "$decode_status" -ne 0 ]; then
            ready=false
          fi

          if [ "$decode_status" -eq 0 ]; then
            gzip --decompress --stdout "$compressed" > "$patch" 2>> "$report"
            gzip_status=$?
          else
            gzip_status=99
          fi
          echo "gzip_status=$gzip_status" >> "$report"
          if [ "$gzip_status" -ne 0 ]; then
            ready=false
          fi

          if [ -f "$patch" ]; then
            actual_patch="$(sha256sum "$patch" | awk '{print $1}')"
          else
            actual_patch=missing
          fi
          echo "expected_patch=$expected_patch" >> "$report"
          echo "actual_patch=$actual_patch" >> "$report"
          if [ "$actual_patch" != "$expected_patch" ]; then
            ready=false
          fi

          if [ "$ready" = true ]; then
            git apply --index --binary "$patch" >> "$report" 2>&1
            apply_status=$?
          else
            apply_status=99
          fi
          echo "git_apply_status=$apply_status" >> "$report"
          if [ "$apply_status" -ne 0 ]; then
            ready=false
          fi

          if [ "$apply_status" -eq 0 ]; then
            rm -rf .github/runtime-hardening-payload
            rm -f .github/workflows/apply-runtime-hardening-payload.yml
            git add -A
            git diff --cached --check >> "$report" 2>&1
            diff_status=$?
            actual_tree="$(git write-tree)"
            changed_count="$(git diff --cached --name-only HEAD | wc -l | tr -d ' ')"
          else
            diff_status=99
            actual_tree=unavailable
            changed_count=unavailable
          fi
          echo "diff_check_status=$diff_status" >> "$report"
          echo "expected_tree=$expected_tree" >> "$report"
          echo "actual_tree=$actual_tree" >> "$report"
          echo "expected_changed_count=45" >> "$report"
          echo "actual_changed_count=$changed_count" >> "$report"

          if [ "$diff_status" -ne 0 ] || \
             [ "$actual_tree" != "$expected_tree" ] || \
             [ "$changed_count" != "45" ]; then
            ready=false
          fi

          echo "ready=$ready" >> "$report"
          echo "ready=$ready" >> "$GITHUB_OUTPUT"

      - name: Upload import diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-hardening-import-diagnostic
          path: /tmp/runtime-hardening-import-report.txt
          if-no-files-found: error
          retention-days: 7

      - name: Require exact reconstruction
        if: steps.reconstruct.outputs.ready != 'true'
        shell: bash
        run: |
          cat /tmp/runtime-hardening-import-report.txt
          exit 1

      - name: Commit exact reconstructed tree
        if: steps.reconstruct.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "core: import complete runtime hardening and latency work"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
